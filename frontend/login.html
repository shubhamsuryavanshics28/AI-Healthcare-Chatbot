<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Login - ArogyaAI</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <style>
    .auth-container {
      max-width: 440px;
      margin: 3rem auto;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <a href="/" class="nav-brand">
      <div class="nav-logo-icon">➕</div>
      <div class="brand-text">
        <h1>ArogyaAI <span class="brand-badge">26P_3CSE294</span></h1>
      </div>
    </a>
    <ul class="nav-links" id="navLinks"></ul>
    <div class="nav-auth" id="navAuth"></div>
  </header>

  <main class="container">
    <div class="card auth-container">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--primary-dark);">Patient Sign In</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.35rem;">
          Access your clinical chat history and symptom assessments
        </p>
      </div>

      <div id="authError" class="alert alert-danger" style="display: none;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In to Dashboard
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
        Don't have an account yet? <a href="/register" style="color: var(--primary); font-weight: 600;">Register here</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <p class="footer-disclaimer">
        Academic Major Project: AI-Based Healthcare Chatbot for Patient Assistance and Triage (ID: 26P_3CSE294).
      </p>
    </div>
  </footer>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
